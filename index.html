<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light}
html,body{margin:0}
body{font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7f5}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>外回り 場面別手順書</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">

<style>
/* 左に場面の索引、右に本文。索引は固定、本文は場面ごとのカード。 */
:root{
  --paper:#FAFAF8; --surface:#FFFFFF; --ink:#1A1D23; --ink2:#575E67;
  --rule:#DCDDD8; --rule2:#EDEEE9;
  --accent:#1F3864; --accent-soft:#E9EEF6;
  --warn:#8A3A28; --warn-soft:#F8EEEB;
  --chip:#F0F1EC;
  --font-head:"Zen Kaku Gothic New","Yu Gothic",system-ui,sans-serif;
  --font-body:"Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171A; --surface:#1B1E22; --ink:#E7E9EA; --ink2:#A0A6AD;
    --rule:#31353B; --rule2:#24282C;
    --accent:#93B4E6; --accent-soft:#1D2733;
    --warn:#E0947F; --warn-soft:#2D2320;
    --chip:#22262B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15171A; --surface:#1B1E22; --ink:#E7E9EA; --ink2:#A0A6AD;
  --rule:#31353B; --rule2:#24282C;
  --accent:#93B4E6; --accent-soft:#1D2733;
  --warn:#E0947F; --warn-soft:#2D2320;
  --chip:#22262B;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}

/* ---- ヘッダー ---- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--paper); border-bottom:1px solid var(--rule);
}
.top-in{
  max-width:1180px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; flex-direction:column; gap:1px; min-width:0}
.brand b{font-family:var(--font-head); font-weight:700; font-size:17px; letter-spacing:.02em}
.brand span{color:var(--ink2); font-size:11.5px; letter-spacing:.04em}
.search{flex:1; min-width:200px; display:flex; align-items:center; gap:8px;
  border:1px solid var(--rule); background:var(--surface); border-radius:3px; padding:0 10px}
.search svg{flex:none; opacity:.5}
.search input{
  flex:1; min-width:0; border:0; background:transparent; color:inherit;
  font:inherit; font-size:14px; padding:8px 0; outline:none;
}
.search button{
  border:0; background:transparent; color:var(--ink2); font:inherit; font-size:12px;
  cursor:pointer; padding:4px 2px;
}
.search button:hover{color:var(--ink)}
.hits{color:var(--ink2); font-size:12px; white-space:nowrap}
.ver{
  font-family:var(--font-head); font-size:11px; font-weight:500; letter-spacing:.04em;
  color:var(--accent); background:var(--accent-soft); border:1px solid var(--rule);
  padding:3px 9px; border-radius:2px; white-space:nowrap; font-variant-numeric:tabular-nums;
}

/* ---- 全体の並び ---- */
.wrap{max-width:1180px; margin:0 auto; padding:0 20px; padding-block:26px 64px;
  display:grid; grid-template-columns:232px minmax(0,1fr); gap:38px; align-items:start}

/* ---- 索引 ---- */
.index{position:sticky; top:calc(env(safe-area-inset-top,0px) + 74px)}
.index h2{
  font-family:var(--font-head); font-size:11px; font-weight:700; letter-spacing:.14em;
  color:var(--ink2); margin:0 0 10px; text-transform:none;
}
.index ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.index a{
  display:grid; grid-template-columns:22px 1fr; gap:8px; align-items:baseline;
  padding:5px 8px 5px 0; text-decoration:none; color:var(--ink);
  font-size:13px; line-height:1.5; border-left:2px solid transparent;
  padding-left:10px; border-radius:0 2px 2px 0;
}
.index a em{font-style:normal; color:var(--ink2); font-size:12px;
  font-variant-numeric:tabular-nums}
.index a:hover{background:var(--rule2)}
.index a.on{border-left-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:500}
.index a.on em{color:var(--accent)}
.index .note{margin-top:14px; padding-top:12px; border-top:1px solid var(--rule);
  font-size:11.5px; color:var(--ink2); line-height:1.7}

/* ---- 場面カード ---- */
.scenes{display:flex; flex-direction:column; gap:26px; min-width:0}
.scene{
  background:var(--surface); border:1px solid var(--rule); border-radius:3px;
  scroll-margin-top:92px; overflow:hidden;
}
.scene > header{
  display:grid; grid-template-columns:auto minmax(0,1fr) auto;
  align-items:baseline; gap:4px 12px;
  padding:14px 20px; border-bottom:1px solid var(--rule); background:var(--chip);
}
.scene > header .n{
  font-family:var(--font-head); font-weight:700; font-size:12px; color:var(--accent);
  letter-spacing:.1em; font-variant-numeric:tabular-nums;
}
.scene > header h3{
  font-family:var(--font-head); font-weight:700; font-size:16.5px; margin:0;
  letter-spacing:.01em; text-wrap:balance;
}
.scene > header .tag{
  font-size:11px; color:var(--ink2); letter-spacing:.04em; white-space:nowrap;
}
@media (max-width:620px){
  .scene > header{grid-template-columns:auto minmax(0,1fr)}
  .scene > header .tag{grid-column:1 / -1; margin-top:2px}
}
.body{padding:18px 20px 22px}
.lead{margin:0 0 14px; color:var(--ink2); font-size:14px}

/* ---- 手順 ---- */
.steps{margin:0; padding:0}
.steps .step{
  display:grid; grid-template-columns:28px minmax(0,1fr); gap:12px;
  padding:7px 0; border-top:1px solid var(--rule2);
}
.steps .step:first-child{border-top:0}
.steps .num{
  font-family:var(--font-head); font-weight:700; font-size:12.5px;
  color:var(--ink2); background:var(--chip); border-radius:2px;
  text-align:center; line-height:22px; height:22px; margin-top:3px;
  font-variant-numeric:tabular-nums;
}
.steps p{margin:0}
.steps .memo{
  margin:5px 0 0; padding-left:15px; position:relative;
  color:var(--accent); font-size:13.5px; line-height:1.75;
}
.steps .memo::before{content:"※"; position:absolute; left:0; font-size:12px; opacity:.85}

/* ---- 完了の条件 ---- */
.done{
  margin:18px 0 0; border:2px solid var(--ink); border-radius:3px; padding:13px 16px 14px;
}
.done h4{
  font-family:var(--font-head); font-size:13px; font-weight:700; margin:0 0 9px;
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
}
.done h4 span{font-weight:500; font-size:11.5px; color:var(--ink2); letter-spacing:.02em}
.done ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px}
.done label{display:flex; gap:9px; align-items:flex-start; cursor:pointer; font-size:14px}
.done input{margin:5px 0 0; accent-color:var(--accent); flex:none; width:15px; height:15px}
.done input:checked + span{color:var(--ink2); text-decoration:line-through}
.done .reset{
  margin-top:10px; border:1px solid var(--rule); background:transparent; color:var(--ink2);
  font:inherit; font-size:11.5px; padding:3px 9px; border-radius:2px; cursor:pointer;
}
.done .reset:hover{color:var(--ink); border-color:var(--ink2)}

/* ---- 判断の線 ---- */
.judge{margin:18px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:0;
  border:1px solid var(--rule); border-radius:3px; overflow:hidden}
.judge > div{min-width:0}
.judge > div + div{border-left:1px solid var(--rule)}
.judge h4{
  font-family:var(--font-head); font-size:12.5px; font-weight:700; margin:0;
  padding:8px 14px; background:var(--chip); border-bottom:1px solid var(--rule);
}
.judge ul{list-style:none; margin:0; padding:10px 14px 12px;
  display:flex; flex-direction:column; gap:7px; font-size:13.5px; line-height:1.7}
.judge li{padding-left:13px; position:relative}
.judge li::before{content:""; position:absolute; left:0; top:.72em;
  width:5px; height:5px; border-radius:50%; background:var(--ink2)}
.judge .ask li::before{background:var(--accent)}

/* ---- 詰まったとき ---- */
.stuck{margin:20px 0 0}
.stuck h4, .eyes h4{
  font-family:var(--font-head); font-size:12.5px; font-weight:700; margin:0 0 8px;
  letter-spacing:.03em;
}
.stuck ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px}
.stuck li{
  display:grid; grid-template-columns:minmax(120px,0.9fr) 20px minmax(0,2.1fr);
  gap:10px; align-items:start; padding:8px 0; border-top:1px solid var(--rule2);
  font-size:13.5px; line-height:1.7;
}
.stuck li:first-child{border-top:1px solid var(--rule2)}
.stuck .case{font-weight:500}
.stuck .arrow{color:var(--ink2); text-align:center; line-height:1.7}

/* ---- 営業から見ると ---- */
.eyes{margin:20px 0 0}
.eyes dl{margin:0; display:grid; grid-template-columns:auto minmax(0,1fr);
  gap:1px 12px; align-items:start}
.eyes dt{
  font-family:var(--font-head); font-size:11.5px; font-weight:700; letter-spacing:.06em;
  padding:5px 9px; border-radius:2px; background:var(--chip); color:var(--ink2);
  white-space:nowrap; line-height:1.5;
}
.eyes dt.bad{background:var(--warn-soft); color:var(--warn)}
.eyes dd{margin:0; padding:5px 0; font-size:13.5px; line-height:1.7}
.eyes dd.bad{color:var(--warn)}

/* ---- 場合の切り替え ---- */
.axes{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px 22px;
  margin:0 0 16px; padding:12px 14px 10px; border:1px solid var(--rule); border-radius:3px;
  background:var(--chip)}
/* 手順の中の分岐。枠も塗りもなし。手順の行と同じ骨格 */
.axrow{
  display:grid; grid-template-columns:28px minmax(0,1fr); gap:12px;
  padding:9px 0; border-top:1px solid var(--rule2);
}
.axrow .mark{
  font-family:var(--font-head); font-size:12px; font-weight:700; color:var(--accent);
  border:1px solid var(--accent); border-radius:2px;
  text-align:center; line-height:20px; height:22px; margin-top:3px;
}
.axrow-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:1px}
.axislabel.inline{display:inline; margin:0; letter-spacing:.06em; color:var(--ink)}
.routes.small{margin:0; gap:5px}
.routes.small button{font-size:12px; padding:3px 10px}
.memo.plain::before{content:""}
.memo.plain{padding-left:0; margin-top:6px}
.axis{min-width:0}
.axislabel{display:block; font-family:var(--font-head); font-size:11px; font-weight:700;
  letter-spacing:.1em; color:var(--ink2); margin-bottom:6px}
.routes{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 6px}
.routes button{
  font:inherit; font-family:var(--font-head); font-size:12.5px; font-weight:500;
  padding:5px 12px; border:1px solid var(--rule); background:var(--surface); color:var(--ink2);
  border-radius:2px; cursor:pointer; line-height:1.6;
}
.routes button:hover{border-color:var(--ink2); color:var(--ink)}
.routes button.on{background:var(--accent); border-color:var(--accent); color:var(--surface); font-weight:700}
.routenote{margin:0; font-size:12.5px; color:var(--ink2); line-height:1.65}
.only{
  display:inline-block; margin-left:7px; padding:1px 7px; border-radius:2px;
  background:var(--accent-soft); color:var(--accent);
  font-family:var(--font-head); font-size:10.5px; font-weight:500; letter-spacing:.03em;
  white-space:nowrap; vertical-align:2px;
}
.eyes .bad .only, dd.bad .only{background:var(--warn-soft); color:var(--warn)}

/* ---- 未整備の印 ---- */
.todo{
  margin:16px 0 0; padding:9px 13px; border:1px dashed var(--rule);
  border-radius:3px; color:var(--ink2); font-size:12.5px; line-height:1.7;
}

mark{background:var(--accent-soft); color:inherit; padding:0 1px; border-radius:2px}
.empty{padding:40px 4px; color:var(--ink2); font-size:14px}

/* ---- 狭い画面 ---- */
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr); gap:20px}
  .index{position:static}
  .index ol{display:grid; grid-template-columns:repeat(auto-fill,minmax(188px,1fr)); gap:0}
  .judge{grid-template-columns:minmax(0,1fr)}
  .judge > div + div{border-left:0; border-top:1px solid var(--rule)}
  .stuck li{grid-template-columns:minmax(0,1fr); gap:2px}
  .stuck .arrow{display:none}
  .stuck .case{color:var(--accent)}
}
@media (max-width:460px){
  .top-in{padding:12px 16px}
  .wrap{padding:0 16px; padding-block:20px 56px}
  .body{padding:16px 15px 20px}
  .scene > header{padding:12px 15px}
}
@media print{
  .top,.index{display:none}
  .wrap{grid-template-columns:1fr; padding:0}
  .scene{break-inside:avoid; border-color:#999}
}
</style>

<div class="top">
  <div class="top-in">
    <div class="brand">
      <b>外回り　場面別手順書</b>
      <span>ケイ・ティ・グループ　福祉用具事業部</span>
    </div>
    <span class="ver" id="ver" title="この版が作られた日時">版 2026-10-01 15:33</span>
    <label class="search" for="q">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
      <input id="q" type="search" placeholder="場面や言葉で探す　たとえば 解約、つながらない、タイムツリー" autocomplete="off">
      <button type="button" id="clear" hidden>消す</button>
    </label>
    <div class="hits" id="hits"></div>
  </div>
</div>

<div class="wrap">
  <nav class="index" aria-label="場面の索引">
    <h2>場面</h2>
    <ol id="toc"></ol>
    <p class="note">場面ごとに、やることだけを順番に並べた。制度の根拠は『新人研修テキスト』を見る。</p>
  </nav>
  <main class="scenes" id="scenes"></main>
</div>

<script>
const SCENES = [
 {name:"納品の依頼があったとき（追加納品の場合）",
  lead:"すでに使っている利用者に、用具を足す話。どこから来たかで最初にやることが変わる。",
  axes:[
   {id:"from", label:"依頼の出どころ",
    opts:[{id:"cm",label:"CMから",note:"営業に入り、営業が誰を行かせるか決める。いちばん多い形"},
          {id:"user",label:"利用者・家族から",note:"すでに使っている利用者から直接かかってくる"},
          {id:"sales",label:"営業から",note:"営業が訪問先で拾ってきた話"}]},
   {id:"fix", label:"商品の決まり具合", inline:true, only:["cm","sales"],
    opts:[{id:"fixed",label:"決まっている",note:"品番まで決まっている。発注して持っていく"},
          {id:"half",label:"ある程度決まっている",note:"種目は決まっているが機種は未定。複数持っていって現場で合わせる"},
          {id:"vague",label:"ざっくりしか分からない",note:"候補を想定して持っていく。持っていったもので決まるのがベスト"}]},
   {id:"sched", label:"日程の決まり方", inline:true, only:["cm","sales"],
    opts:[{id:"self",label:"こちらで調整",note:"「そっちで利用者と調整して納品して」と言われた場合"},
          {id:"given",label:"日時の指定あり",note:"「○月○日の何時に来て」と言われた場合"},
          {id:"withcm",label:"日時の指定あり（CM同行）",note:"「○月○日の何時に来て」。CMも同席する"}]}],
  steps:[
   {t:"対象の利用者名を確認する", only:["cm","sales"],
    m:["通常はCMから言ってくれる"]},
   {t:"対象の利用者名を確認する", only:["user"]},
   {t:"担当のCMと居宅介護支援事業所を、社内の記録で調べる", only:["user"],
    m:["利用者には聞かない。すでに使っている人なので記録にある"]},
   {t:"相談の内容と、困っていることを確認する"},
   {t:"営業がすでに聞いている内容を確認する。同じことを二度聞かない", only:["sales"]},
   {t:"担当営業に報告する", only:["user"],
    m:["CMへ誰が伝えるかは営業が決める。営業から伝えるのが多い。直接伝えてくれと言われることもある"]},
   {t:"営業の指示に従い、CMに連絡してプランへの位置づけを確認する。または営業から連絡してもらう", only:["user"],
    m:["プランに載って初めて保険で入れられる。先に動くと自費になる"]},

   {t:"身体状況と家屋の状況を、分かる範囲で聞き取る", only:["user"]},
   {t:"候補になりうるものを複数想定して積む", only:["user"],
    m:["利用者からの相談で、商品まで決まっていることはない。現場で決める前提で動く"]},

   {axis:"fix"},

   {t:"どういう状況で使うのかを聞き取る", only:["fixed"]},
   {t:"卸会社に発注し、当日持っていく", only:["fixed"],
    m:["聞き取った内容しだいでは、別商品も持っていくか検討する"]},

   {t:"身体状況と家屋の状況を聞き取る", only:["half"]},
   {t:"候補を複数選んで積む", only:["half"]},
   {t:"現場で実際に合わせて、その場で決める", only:["half"]},

   {t:"分かる範囲で状況を聞き取る", only:["vague"]},
   {t:"候補になりうるものを複数想定して積む", only:["vague"],
    m:["持っていったもので決まるのがベスト。どれも合わなければ、その場で選定し直すことになる"]},

   {axis:"sched"},
   {t:"利用者に連絡して、訪問の日程を決める", only:["self"],
    m:["いつまでに必要かを先に押さえる。退院日が決まっている案件は、そこから逆算する"]},
   {t:"指定された日時で動けるか、自分の予定と照らす", only:["given","withcm"]},
   {t:"動けなければ、早めにCMへ返す。前後の候補を2つ3つ用意してから返す", only:["given","withcm"]},
   {t:"CMが同行するので、先に着いておく", only:["withcm"],
    m:["CMの前での受け答えは、そのまま次の依頼につながる。分からないことは、分からないと言って持ち帰る"]},
   {t:"訪問の日程を利用者と決める", only:["user"],
    m:["いつまでに必要かを先に押さえる。退院日が決まっている案件は、そこから逆算する"]},
   {t:"タイムツリーに入力する",
    m:["自分が動く予定は自分で入れる。入っていないと、営業からは止まって見える"]}],
  done:[{t:"どの利用者の、何の話かが手元にある"},
        {t:"訪問の日程がタイムツリーに入っている"},
        {t:"担当営業に話が入っている", only:["user"]},
        {t:"CMへ誰が連絡するかが決まっている", only:["user"]},
        {t:"CMの了解が取れている", only:["user"]},
        {t:"持っていく商品が決まり、発注が出ている", only:["fixed"]},
        {t:"候補を複数積んである", only:["half","vague"]},
        {t:"候補を複数積んである", only:["user"]}],
  mine:[{t:"何を何台積むか", only:["half","vague"]},
        {t:"何を何台積むか", only:["user"]},
        {t:"訪問の日程を利用者と決めること", only:["self"]},
        {t:"現場で合わせて決めること", only:["half"]},
        {t:"社内の記録を自分で調べること", only:["user"]},
        {t:"事前情報が足りないときに、営業へ聞き直すこと"}],
  ask:[{t:"これまでにCMと決まっていることがないか。営業に聞く", only:["cm","sales"]},
       {t:"CMへ誰が連絡するか。営業に確認する", only:["user"]},
       {t:"別商品も持っていくか迷うとき。営業に相談する", only:["fixed"]},

   {t:"工事の範囲を決める"},
   {t:"施工会社の見積を基に、自社の見積を作る"},
   {t:"見積を提示して承諾を得る"},
   {t:"住宅改修が必要な理由書を書く"},
   {t:"事前申請の書類一式を揃えて役所に出す"},
   {t:"受理を確認する", m:["出しただけでは足りない。受理される前に着工すると、支給されない"]},
   {t:"着工前の写真を撮る。日付入り"},
   {t:"工事前に立ち会う"},
   {t:"工事後に立ち会う"},
   {t:"完了後の写真を撮る。日付入り"},
   {t:"事後申請の書類を出す"}]}
];

const esc = (s) => s.replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nameToId = new Map(SCENES.map((s, i) => [s.name, 's' + (i + 1)]));

// 本文に出てくる「場面名」を、その場面へのリンクにする
function link(html){
  for (const [nm, id] of nameToId) {
    html = html.split('「' + esc(nm) + '」').join('「<a href="#' + id + '">' + esc(nm) + '</a>」');
  }
  return html;
}

const toc = document.getElementById('toc');
const main = document.getElementById('scenes');

/* 項目は文字列でも {t,only} でもよい。
   only に軸の選択肢idを書くと、その選択のときだけ出る。軸ごとに別々に効く。 */
const asItem = (x) => (typeof x === 'string' ? { t: x } : x);
function keepIn(sc, only, state, skip){
  if (!only) return true;
  for (const ax of sc.axes) {
    if (ax.id === skip) continue;
    const ids = only.filter((o) => ax.opts.some((p) => p.id === o));
    if (ids.length && !ids.includes(state[ax.id])) return false;
  }
  return true;
}
/* 軸そのものが、いまの選択で出ているか。出ていない軸に属する項目は消す */
const axisOn = (sc, ax, state) => keepIn(sc, ax.only, state, ax.id);
function keep(sc, x, state){
  if (!x.only || !sc.axes) return true;
  for (const ax of sc.axes) {
    const ids = x.only.filter((o) => ax.opts.some((p) => p.id === o));
    if (!ids.length) continue;
    if (!axisOn(sc, ax, state)) return false;
    if (!ids.includes(state[ax.id])) return false;
  }
  return true;
}
const allText = (sc) => [sc.name, sc.lead || '']
  .concat(sc.steps.map((s) => s.t + ' ' + (s.m || []).join(' ')))
  .concat((sc.done || []).map((x) => asItem(x).t))
  .concat((sc.mine || []).map((x) => asItem(x).t))
  .concat((sc.ask || []).map((x) => asItem(x).t))
  .concat((sc.good || []).map((x) => asItem(x).t))
  .concat((sc.bad || []).map((x) => asItem(x).t))
  .concat((sc.stuck || []).map((x) => (Array.isArray(x) ? x.join(' ') : x.c + ' ' + x.a)))
  .concat((sc.axes || []).flatMap((a) => a.opts.map((o) => o.label + ' ' + o.note)))
  .join(' ').replace(/\s+/g, ' ');

function bodyHTML(sc, id, state){
  const pick = (arr) => (arr || []).map(asItem).filter((x) => keep(sc, x, state));
  let h = '';
  if (sc.lead) h += '<p class="lead">' + esc(sc.lead) + '</p>';
  const btns = (ax, cls) => '<div class="routes' + (cls ? ' ' + cls : '') +
    '" role="group" aria-label="' + esc(ax.label) + '">' +
    ax.opts.map((o) => '<button type="button" data-ax="' + ax.id + '" data-r="' + o.id + '"' +
      (state[ax.id] === o.id ? ' class="on"' : '') + '>' + esc(o.label) + '</button>').join('') +
    '</div>';

  const axisBox = (ax) => {
    const cur = ax.opts.find((o) => o.id === state[ax.id]);
    return '<div class="axes"><div class="axis">' +
      '<span class="axislabel">' + esc(ax.label) + '</span>' + btns(ax) +
      (cur ? '<p class="routenote">' + esc(cur.note) + '</p>' : '') + '</div></div>';
  };

  /* 手順の中に挟む分岐。手順の行と同じ骨格にして、目立たせない */
  const axisRow = (ax) => {
    const cur = ax.opts.find((o) => o.id === state[ax.id]);
    return '<div class="axrow"><span class="mark" aria-hidden="true">？</span><div>' +
      '<div class="axrow-head"><span class="axislabel inline">' + esc(ax.label) + '</span>' +
      btns(ax, 'small') + '</div>' +
      (cur ? '<p class="memo plain">' + esc(cur.note) + '</p>' : '') + '</div></div>';
  };

  (sc.axes || []).filter((ax) => !ax.inline).forEach((ax) => { h += axisBox(ax); });

  h += '<div class="steps">';
  let n = 0;
  sc.steps.forEach((s) => {
    if (s.axis) {
      const ax = sc.axes.find((a) => a.id === s.axis);
      if (ax && axisOn(sc, ax, state)) h += axisRow(ax);
      return;
    }
    if (!keep(sc, s, state)) return;
    n++;
    h += '<div class="step"><span class="num">' + n + '</span><div><p>' + link(esc(s.t)) + '</p>' +
      (s.m || []).map((m) => '<p class="memo">' + esc(m) + '</p>').join('') + '</div></div>';
  });
  h += '</div>';

  const done = pick(sc.done);
  if (done.length) {
    h += '<div class="done"><h4>完了の条件<span>これが全部そろって終わり</span></h4><ul>' +
      done.map((d) =>
        '<li><label><input type="checkbox" id="' + id + '-d' + hash(d.t) + '"><span>' +
        esc(d.t) + '</span></label></li>').join('') +
      '</ul><button class="reset" type="button" data-reset="' + id + '">チェックを消す</button></div>';
  }
  const mine = pick(sc.mine), ask = pick(sc.ask);
  if (mine.length || ask.length) {
    h += '<div class="judge"><div><h4>自分で決めてよい</h4><ul>' +
      mine.map((x) => '<li>' + esc(x.t) + '</li>').join('') +
      '</ul></div><div><h4>確認してから動く</h4><ul class="ask">' +
      ask.map((x) => '<li>' + esc(x.t) + '</li>').join('') + '</ul></div></div>';
  }
  const stuck = (sc.stuck || [])
    .map((x) => (Array.isArray(x) ? { c: x[0], a: x[1] } : x))
    .filter((x) => keep(sc, x, state));
  if (stuck.length) {
    h += '<div class="stuck"><h4>詰まったとき</h4><ol>' +
      stuck.map((x) => '<li><span class="case">' + esc(x.c) + '</span>' +
        '<span class="arrow" aria-hidden="true">▶</span><span>' + esc(x.a) + '</span></li>').join('') +
      '</ol></div>';
  }
  const good = pick(sc.good), bad = pick(sc.bad);
  if (good.length || bad.length) {
    h += '<div class="eyes"><h4>この場面で、営業から見ると</h4><dl>' +
      good.map((x) => '<dt>助かる</dt><dd>' + esc(x.t) + '</dd>').join('') +
      bad.map((x) => '<dt class="bad">困る</dt><dd class="bad">' + esc(x.t) + '</dd>').join('') +
      '</dl></div>';
  }
  if (!(sc.done && sc.done.length)) {
    h += '<p class="todo">この場面は手順だけ。完了の条件、判断の線、詰まったとき、営業から見るとは、これから足す。</p>';
  }
  return h;
}

function hash(s){ let n = 0; for (let i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) | 0; return Math.abs(n).toString(36); }

SCENES.forEach((sc, i) => {
  const id = 's' + (i + 1);
  const li = document.createElement('li');
  li.innerHTML = '<a href="#' + id + '" data-id="' + id + '"><em>' + (i + 1) + '</em><span>' + esc(sc.name) + '</span></a>';
  toc.appendChild(li);

  const el = document.createElement('section');
  el.className = 'scene';
  el.id = id;
  el.dataset.text = allText(sc);
  el.innerHTML = '<header><span class="n">' + (i + 1) + '</span><h3>' + esc(sc.name) + '</h3>' +
    (sc.axes ? '<span class="tag">場合で切り替え</span>' :
      (sc.done && sc.done.length ? '' : '<span class="tag">手順のみ</span>')) +
    '</header><div class="body"></div>';
  const body = el.querySelector('.body');
  const state = {};
  (sc.axes || []).forEach((ax) => { state[ax.id] = ax.opts[0].id; });
  body.innerHTML = bodyHTML(sc, id, state);
  body.addEventListener('click', (e) => {
    const b = e.target.closest('.routes button');
    if (!b) return;
    state[b.dataset.ax] = b.dataset.r;
    body.innerHTML = bodyHTML(sc, id, state);
    restoreChecks(body);
  });
  main.appendChild(el);
});

/* ---- チェックの保存。消えても困らない範囲にとどめる ---- */
const KEY = 'tejun-check';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }
function restoreChecks(root){
  root.querySelectorAll('.done input').forEach((b) => {
    b.checked = !!saved[b.id];
    b.onchange = () => {
      saved[b.id] = b.checked;
      try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    };
  });
}
restoreChecks(document);
main.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-reset]');
  if (!btn) return;
  document.querySelectorAll('#' + btn.dataset.reset + ' .done input').forEach((b) => {
    b.checked = false; saved[b.id] = false;
  });
  try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
});

/* ---- 検索 ---- */
const q = document.getElementById('q');
const hits = document.getElementById('hits');
const clearBtn = document.getElementById('clear');
const cards = [...document.querySelectorAll('.scene')];
const links = [...document.querySelectorAll('#toc a')];
const empty = document.createElement('p');
empty.className = 'empty';
empty.hidden = true;
empty.textContent = '見つかりません。別の言葉で探してください。';
main.appendChild(empty);

function unmark(root){
  root.querySelectorAll('mark').forEach((m) => {
    const t = document.createTextNode(m.textContent);
    m.replaceWith(t);
  });
  root.normalize();
}
function markAll(root, term){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const todo = [];
  while (w.nextNode()) {
    const n = w.currentNode;
    if (n.parentElement.closest('mark')) continue;
    if (n.nodeValue.toLowerCase().includes(term)) todo.push(n);
  }
  todo.forEach((n) => {
    const frag = document.createDocumentFragment();
    let rest = n.nodeValue, idx;
    while ((idx = rest.toLowerCase().indexOf(term)) !== -1) {
      if (idx) frag.appendChild(document.createTextNode(rest.slice(0, idx)));
      const m = document.createElement('mark');
      m.textContent = rest.slice(idx, idx + term.length);
      frag.appendChild(m);
      rest = rest.slice(idx + term.length);
    }
    if (rest) frag.appendChild(document.createTextNode(rest));
    n.replaceWith(frag);
  });
}

function run(){
  const term = q.value.trim().toLowerCase();
  clearBtn.hidden = !term;
  let n = 0;
  cards.forEach((c, i) => {
    unmark(c);
    const hit = !term || c.dataset.text.toLowerCase().includes(term);
    c.hidden = !hit;
    links[i].parentElement.hidden = !hit;
    if (hit) { n++; if (term) markAll(c, term); }
  });
  empty.hidden = n !== 0;
  hits.textContent = term ? n + ' / ' + cards.length + ' 場面' : cards.length + ' 場面';
}
q.addEventListener('input', run);
clearBtn.addEventListener('click', () => { q.value = ''; run(); q.focus(); });
run();

/* ---- いまどの場面を見ているか ---- */
const io = new IntersectionObserver((es) => {
  es.forEach((e) => {
    if (!e.isIntersecting) return;
    links.forEach((a) => a.classList.toggle('on', a.dataset.id === e.target.id));
  });
}, { rootMargin: '-90px 0px -65% 0px' });
cards.forEach((c) => io.observe(c));
</script>
